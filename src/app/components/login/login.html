<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card">
        <div class="card-body p-4">
          <h1 class="h3 mb-4">Log in</h1>

          @if (successMessage) {
            <div class="alert alert-success">{{ successMessage }}</div>
          }
          @if (errorMessage) {
            <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
          }

          <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input id="email" name="email" type="email" class="form-control"
                     [(ngModel)]="email" #emailInput="ngModel" required email>
              @if (emailInput.invalid && emailInput.touched) {
                <div class="text-danger small mt-1">Please enter a valid email address.</div>
              }
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input id="password" name="password" type="password" class="form-control"
                     [(ngModel)]="password" #passwordInput="ngModel" required>
              @if (passwordInput.invalid && passwordInput.touched) {
                <div class="text-danger small mt-1">Please enter your password.</div>
              }
            </div>

            <button type="submit" class="btn btn-primary w-100"
                    [disabled]="loginForm.invalid || loading">
              {{ loading ? 'Logging in...' : 'Log in' }}
            </button>
          </form>

          <p class="mt-3 mb-0 text-center">
            No account? <a [routerLink]="['/register']">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
